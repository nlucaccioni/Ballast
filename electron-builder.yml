appId: com.nlucaccioni.ballast
productName: Ballast
copyright: Copyright © 2026 nlucaccioni

directories:
  output: dist
  buildResources: assets

files:
  - src/**/*
  - config/**/*
  - assets/icons/**/*
  - package.json
  - "!**/*.map"

publish:
  provider: github
  owner: nlucaccioni
  repo: ballast
  # Left as a draft here on purpose: each platform leg in release.yml
  # uploads its own assets to this same draft in turn, and a final step
  # publishes it only once every leg has finished. Publishing immediately
  # per-leg (releaseType: release) closes the release out after the first
  # leg, so the next leg finds nothing to attach to and creates a second,
  # incomplete one instead.
  releaseType: draft

# A single 1024x1024 source PNG is enough — electron-builder generates the
# platform-specific .ico/.icns from it during the build, no pre-conversion
# needed. Applies to both win/mac below (each target's own `icon` key isn't
# set, so both fall back to this shared one).
icon: assets/icons/Ballast_Icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
    # A single self-contained .exe alongside the installer — no install
    # step, no Program Files entry, just run it. Still unsigned, so it'll
    # still trigger a SmartScreen "Windows protected your PC" prompt on
    # first run (a click-through, not a hard block like macOS Gatekeeper).
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Ad-hoc signed (identity: '-'), not a real Developer ID cert — no Apple
# account involved, just codesign with a locally-generated identity instead
# of leaving the binary unsigned entirely. That's still enough for Gatekeeper
# to flag it as being from an unidentified developer, but downgrades it from
# the harsher "is damaged and can't be opened" error unsigned arm64 builds
# hit (macOS requires *some* signature to even run an arm64 binary at all —
# without one, the quarantine check on first launch reports it as damaged
# rather than just untrusted). Users still need to right-click -> Open the
# first time (or run `xattr -cr /Applications/Ballast.app` if even that
# fails). Fixing this for real (no warning at all) means enrolling in the
# Apple Developer Program and wiring up real CSC_LINK/APPLE_ID secrets plus
# notarization in the release workflow.
mac:
  identity: "-"
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
