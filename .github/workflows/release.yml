name: Release

# Pushing a version tag (e.g. v0.1.0) builds Ballast on both a Windows and a
# macOS runner and publishes both artifacts to a GitHub Release matching
# that tag — see electron-builder.yml's `publish` config. Nothing here can
# produce a real Mac build locally on Windows, which is why this exists.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # electron-builder's GitHub publisher looks up (or creates) the release
  # for this tag before it can upload to it — and does that check
  # separately for each file it uploads, with no lock between them, so
  # *any* concurrent uploads racing against a not-yet-existing release can
  # each end up creating their own. That includes multiple files within a
  # single platform leg (the .exe, its blockmap, and latest.yml all
  # racing each other), not just the two platform legs against one
  # another. Pre-creating the (empty) draft here means every upload from
  # either platform, however concurrent, finds the same existing release
  # instead of racing to create one.
  create-release:
    runs-on: ubuntu-latest
    steps:
      # Both gh's own --notes-from-tag detection AND reading the tag
      # ourselves via `git tag --format` fell back to the tag's target
      # *commit* message instead of its own annotation, on real runs.
      # Root cause: actions/checkout defaults fetch-tags to false
      # regardless of fetch-depth (it's a separate, opt-in setting) — so
      # the actual annotated tag object was never fetched, only a
      # lightweight ref to the commit, and every read of "the tag's
      # content" degraded to that commit's own message instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: TEMP DEBUG
        run: |
          echo "--- git describe ---"
          git describe --tags || true
          echo "--- cat-file -t ---"
          git cat-file -t "${{ github.ref_name }}" || true
          echo "--- for-each-ref ---"
          git for-each-ref "refs/tags/${{ github.ref_name }}"
          echo "--- tag -l contents ---"
          git tag -l --format='%(contents)' "${{ github.ref_name }}"
          echo "--- tag -n99 ---"
          git tag -n99 -l "${{ github.ref_name }}"
          echo "--- cat-file -p ---"
          git cat-file -p "refs/tags/${{ github.ref_name }}" || true
          echo "--- end debug ---"
      - run: git tag -l --format='%(contents)' "${{ github.ref_name }}" > /tmp/release-notes.txt
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --notes-file /tmp/release-notes.txt

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs only once both platform legs above have uploaded their assets to
  # the shared draft, then flips it to a real, visible release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo ${{ github.repository }}
