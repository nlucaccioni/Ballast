<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Corner mask</title>
    <style>
      /* Matches sidebar/styles.css's --border-subtle/--bg exactly — this
         mask has to blend seamlessly into the titlebar/sidebar background
         and the #webview-border-top/-left lines it's continuing, so these
         can't drift from that file's own values. Kept in sync by hand
         (separate page, can't share that stylesheet); see index.js for how
         [data-theme] gets set. */
      :root {
        --border-subtle: #303030;
        --bg: #1e1e1e;
      }
      :root[data-theme='light'] {
        --border-subtle: #e3e5ea;
        --bg: #ffffff;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      /* Concave-corner trick, now with a border ring: pixels within
         (radius - borderWidth) of the bottom-right corner stay transparent
         (revealing the real content view behind this overlay); a thin ring
         out to `radius` is painted the border color, so the straight
         #webview-border-top/-left lines (styles.css) have something to
         visually continue into instead of meeting at a hard angle; beyond
         that is chrome background, masking the content view's actual
         hard-cornered edge. This box is sized radius + borderWidth (8px)
         so the ring's outer edge lands exactly at the real radius. */
      .mask {
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at bottom right,
          transparent 6px,
          var(--border-subtle) 6px,
          var(--border-subtle) 7px,
          var(--bg) 7px
        );
      }
    </style>
  </head>
  <body>
    <div class="mask"></div>
    <script src="index.js"></script>
  </body>
</html>
