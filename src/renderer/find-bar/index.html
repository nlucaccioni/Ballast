<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Find bar</title>
    <link rel="stylesheet" href="../shared/fonts/outfit.css" />
    <style>
      /* Same semantic palette as sidebar/styles.css, just the subset this
         page needs — separate page, can't share that stylesheet. Kept in
         sync by hand; see index.js for how [data-theme] gets set. */
      :root {
        --bg: #1e1e1e;
        --surface: #242424;
        --surface-hover: #333;
        --border: #404040;
        --text: #e8e8e8;
        --text-secondary: #aaa;
      }
      :root[data-theme='light'] {
        --bg: #ffffff;
        --surface: #f2f3f7;
        --surface-hover: #e6e8ef;
        --border: #dcdfe6;
        --text: #1c1e26;
        --text-secondary: #5b5f6b;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Outfit', sans-serif;
      }
      /* Fills the overlay's bounds exactly — FIND_BAR_WIDTH/HEIGHT in
         main/view-manager.js size the WebContentsView to this. */
      #bar {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        display: flex;
        align-items: center;
        gap: 4px;
        /* Same open animation as tab-menu/index.html's #menu. */
        opacity: 0;
        transform: scale(0.96) translateY(-4px);
        transition: opacity 150ms ease-out, transform 150ms ease-out;
      }
      #bar.visible {
        opacity: 1;
        transform: none;
      }
      /* See tab-menu/index.html's identical #menu.no-transition. */
      #bar.no-transition {
        transition: none;
      }
      #find-input {
        box-sizing: border-box;
        flex: 1;
        min-width: 0;
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        font-family: inherit;
        font-size: 12px;
      }
      #find-input:focus {
        outline: 1px solid #5b8def;
      }
      #count {
        flex-shrink: 0;
        min-width: 44px;
        padding: 0 4px;
        text-align: center;
        color: var(--text-secondary);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      button {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--surface-hover);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button .icon {
        width: 14px;
        height: 14px;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <input id="find-input" type="text" autocomplete="off" spellcheck="false" placeholder="Find in page" />
      <span id="count"></span>
      <button id="prev-btn" type="button" title="Previous (Shift+Enter)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m18 15-6-6-6 6" />
        </svg>
      </button>
      <button id="next-btn" type="button" title="Next (Enter)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
      <button id="close-btn" type="button" title="Close (Esc)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
