<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tab menu</title>
    <link rel="stylesheet" href="../shared/fonts/outfit.css" />
    <style>
      /* Same semantic palette as sidebar/styles.css, just the subset this
         page needs — separate page, can't share that stylesheet. Kept in
         sync by hand; see index.js for how [data-theme] gets set. */
      :root {
        --bg: #1e1e1e;
        --surface: #242424;
        --surface-hover: #333;
        --border: #404040;
        --text: #e8e8e8;
      }
      :root[data-theme='light'] {
        --bg: #ffffff;
        --surface: #f2f3f7;
        --surface-hover: #e6e8ef;
        --border: #dcdfe6;
        --text: #1c1e26;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Outfit', sans-serif;
      }
      /* Row-height math (ROW_HEIGHT/GAP/PADDING) is mirrored in
         main/view-manager.js's openTabMenu, which sizes this overlay's
         WebContentsView bounds to fit exactly this content — no native
         auto-sizing across that boundary, so keep the two in sync. */
      #menu {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        display: flex;
        flex-direction: column;
        gap: 6px;
        /* The WebContentsView's own bounds (see main/view-manager.js's
           openTabMenu) are already set to full size before this ever
           shows, so the box itself can't grow — animate in place instead:
           starts faded/scaled down, transitions to full size/opacity once
           index.js adds .visible on open. */
        opacity: 0;
        transform: scale(0.96) translateY(-4px);
        transition: opacity 150ms ease-out, transform 150ms ease-out;
      }
      #menu.visible {
        opacity: 1;
        transform: none;
      }
      /* Closing removes .visible while the view is about to go off-screen
         (see main/view-manager.js's closeTabMenu) — without this, that
         removal starts a reverse transition that freezes mid-flight the
         instant rendering pauses, then resumes right as the next open
         happens, colliding with the fresh forward transition and leaving
         almost nothing left to actually animate. Closing needs to be an
         instant jump, not a transition of its own. */
      #menu.no-transition {
        transition: none;
      }
      #url-input {
        box-sizing: border-box;
        width: 100%;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        font-size: 12px;
      }
      #url-input:focus {
        outline: 1px solid #5b8def;
      }
      .menu-action {
        flex-shrink: 0;
        height: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
      }
      .menu-action[hidden] {
        display: none;
      }
      .menu-action:hover {
        background: var(--surface-hover);
      }
      .menu-action .icon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <form id="url-form">
        <input id="url-input" type="text" autocomplete="off" spellcheck="false" />
      </form>
      <!-- Icons from lucide-static (ISC license), copied inline — see
           sidebar/index.html's comment for why. -->
      <button class="menu-action" id="duplicate-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
        </svg>
        <span>Duplicate tab</span>
      </button>
      <button class="menu-action" id="promote-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2" /><path d="M10 4v4" /><path d="M2 8h20" /><path d="M6 4v4" />
        </svg>
        <span>Open as new app</span>
      </button>
      <button class="menu-action" id="set-primary-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" />
        </svg>
        <span>Set as primary</span>
      </button>
      <button class="menu-action" id="external-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        </svg>
        <span>Open in default browser</span>
      </button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
