<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Ballast</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="titlebar">
      <!-- Icons from lucide-static (ISC license) — copied inline rather than
           loaded at runtime since this project has no bundler; see
           node_modules/lucide-static/icons for the originals. -->
      <button id="hamburger-button" aria-label="Menu">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5h16" /><path d="M4 12h16" /><path d="M4 19h16" />
        </svg>
      </button>
      <div id="nav-controls">
        <button id="nav-back" aria-label="Back">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7" /><path d="M19 12H5" />
          </svg>
        </button>
        <button id="nav-forward" aria-label="Forward">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" /><path d="m12 5 7 7-7 7" />
          </svg>
        </button>
        <button id="nav-reload" aria-label="Reload">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" />
          </svg>
        </button>
      </div>
    </div>
    <div id="sidebar"></div>
    <!-- The webview itself is a native WebContentsView, not stylable with
         CSS — its bounds are inset 1px on the top/left (see
         main/view-manager.js) and these two lines sit in that gap to read
         as a border around it. -->
    <div id="webview-border-top"></div>
    <div id="webview-border-left"></div>
    <script src="index.js"></script>
  </body>
</html>
