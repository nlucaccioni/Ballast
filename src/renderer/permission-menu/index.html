<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Permission menu</title>
    <link rel="stylesheet" href="../shared/fonts/outfit.css" />
    <style>
      /* Same semantic palette as sidebar/styles.css, just the subset this
         page needs — separate page, can't share that stylesheet. Kept in
         sync by hand; see index.js for how [data-theme] gets set. */
      :root {
        --bg: #1e1e1e;
        --surface: #242424;
        --border: #404040;
        --text: #e8e8e8;
        --text-secondary: #aaa;
        /* Brand accent — same hex as sidebar/styles.css's own --accent
           (the app icon's gradient colors), not a generic blue. Dark
           theme's is a light cyan, so text sitting on a solid fill of it
           (see .segmented button[data-state='ask'].active) needs dark
           text, not white — --accent-contrast carries whichever of the two
           actually reads against this theme's own --accent. */
        --accent: #c6f8ff;
        --accent-contrast: #1c1e26;
        /* Same values as permissions-page/index.html's --state-allow/
           --state-block, so a given state reads identically in both UIs. */
        --state-allow: #34a853;
        --state-block: #eb5757;
      }
      :root[data-theme='light'] {
        --bg: #ffffff;
        --surface: #f2f3f7;
        --border: #dcdfe6;
        --text: #1c1e26;
        --text-secondary: #5b5f6b;
        --accent: #595cff;
        --accent-contrast: #ffffff;
        --state-allow: #1e8e3e;
        --state-block: #d33;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Outfit', sans-serif;
      }
      /* Sizing math (PADDING/GAP/TITLE_HEIGHT/ROW_HEIGHT) is mirrored in
         main/view-manager.js's PERMISSION_MENU_* constants, which size this
         overlay's WebContentsView bounds to fit exactly this content — no
         native auto-sizing across that boundary, so keep the two in sync. */
      #menu {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        display: flex;
        flex-direction: column;
        gap: 8px;
        /* Same enter/exit transition technique as tab-menu/group-menu — see
           group-menu/index.html's identical comment for why. */
        opacity: 0;
        transform: scale(0.96) translateY(-4px);
        transition: opacity 150ms ease-out, transform 150ms ease-out;
      }
      #menu.visible {
        opacity: 1;
        transform: none;
      }
      #menu.no-transition {
        transition: none;
      }
      #header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #title {
        flex: 1;
        min-width: 0;
        height: 18px;
        line-height: 18px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #close-btn {
        flex-shrink: 0;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 4px;
      }
      #close-btn:hover {
        background: var(--bg);
        color: var(--text);
      }
      #rows {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .perm-row {
        height: 30px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .perm-label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-size: 13px;
        color: var(--text);
      }
      .perm-label span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .perm-icon {
        flex-shrink: 0;
        width: 15px;
        height: 15px;
        color: var(--text-secondary);
      }
      .segmented {
        flex-shrink: 0;
        display: flex;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .segmented button {
        box-sizing: border-box;
        border: none;
        border-left: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-secondary);
        font-size: 11px;
        padding: 0 8px;
        height: 24px;
        cursor: pointer;
      }
      .segmented button:first-child {
        border-left: none;
      }
      /* Each state hints at its own color even when idle (a light text
         tint) — Allow/Block match permissions-page/index.html's own
         --state-allow/--state-block coloring so a given state reads the
         same in both UIs; Ask keeps the app's own brand accent instead of
         a semantic color, since "ask" isn't good/bad the way allow/block
         are. */
      .segmented button[data-state='allow'] {
        color: var(--state-allow);
      }
      .segmented button[data-state='block'] {
        color: var(--state-block);
      }
      .segmented button.active {
        color: #fff;
      }
      .segmented button[data-state='ask'].active {
        background: var(--accent);
        /* Overrides the plain white above — dark theme's brand accent is a
           light cyan, where white text would barely read. */
        color: var(--accent-contrast);
      }
      .segmented button[data-state='allow'].active {
        background: var(--state-allow);
      }
      .segmented button[data-state='block'].active {
        background: var(--state-block);
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <div id="header">
        <div id="title"></div>
        <button id="close-btn" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="rows"></div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
