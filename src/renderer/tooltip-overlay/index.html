<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tooltip overlay</title>
    <style>
      /* Same semantic palette as sidebar/styles.css, just the subset this
         page needs — separate page, can't share that stylesheet. Kept in
         sync by hand; see index.js for how [data-theme] gets set. */
      :root {
        --surface: #2a2a2a;
        --border: #404040;
        --text: #eee;
      }
      :root[data-theme='light'] {
        --surface: #f2f3f7;
        --border: #dcdfe6;
        --text: #1c1e26;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      #tooltip {
        max-width: 100%;
        box-sizing: border-box;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--surface);
        color: var(--text);
        font-family: sans-serif;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #tooltip[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="tooltip" hidden></div>
    <script src="index.js"></script>
  </body>
</html>
