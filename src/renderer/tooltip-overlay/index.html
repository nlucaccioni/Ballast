<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tooltip overlay</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      #tooltip {
        max-width: 100%;
        box-sizing: border-box;
        padding: 4px 8px;
        border: 1px solid #404040;
        border-radius: 4px;
        background: #2a2a2a;
        color: #eee;
        font-family: sans-serif;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #tooltip[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="tooltip" hidden></div>
    <script src="index.js"></script>
  </body>
</html>
